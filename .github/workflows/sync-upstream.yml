name: Sync upstream

on:
  schedule:
    # 03:17 in Asia/Shanghai and Asia/Singapore (UTC+8).
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'jintonglu6688/rea'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge upstream main without forcing conflicts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch=main
